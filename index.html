<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Predictor</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Car Price Predictor</h1>
            </div>
            <div class="card-body">
                <form id="predictionForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="brand">Brand</label>
                            <input type="text" id="brand" name="brand" placeholder="e.g. Maruti" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="model">Model</label>
                            <input type="text" id="model" name="model" placeholder="e.g. Swift" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="vehicle_age">Vehicle Age (years)</label>
                            <input type="number" id="vehicle_age" name="vehicle_age" min="0" max="30" placeholder="e.g. 5" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="km_driven">Kilometers Driven</label>
                            <input type="number" id="km_driven" name="km_driven" min="0" placeholder="e.g. 45000" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="seller_type">Seller Type</label>
                            <select id="seller_type" name="seller_type" required>
                                <option value="Individual">Individual</option>
                                <option value="Dealer">Dealer</option>
                                <option value="Trustmark Dealer">Trustmark Dealer</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="fuel_type">Fuel Type</label>
                            <select id="fuel_type" name="fuel_type" required>
                                <option value="Petrol">Petrol</option>
                                <option value="Diesel">Diesel</option>
                                <option value="CNG">CNG</option>
                                <option value="LPG">LPG</option>
                                <option value="Electric">Electric</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="transmission_type">Transmission</label>
                            <select id="transmission_type" name="transmission_type" required>
                                <option value="Manual">Manual</option>
                                <option value="Automatic">Automatic</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="mileage">Mileage (kmpl)</label>
                            <input type="number" id="mileage" name="mileage" min="0" step="0.1" placeholder="e.g. 18.5" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="engine">Engine (cc)</label>
                            <input type="number" id="engine" name="engine" min="0" placeholder="e.g. 1197" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="max_power">Max Power (bhp)</label>
                            <input type="number" id="max_power" name="max_power" min="0" step="0.1" placeholder="e.g. 81.80" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="seats">Seats</label>
                            <select id="seats" name="seats" required>
                                <option value="2">2</option>
                                <option value="4">4</option>
                                <option value="5" selected>5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                            </select>
                        </div>
                    </div>
                    
                    <button type="submit" id="predictButton">Predict Price</button>
                </form>
                
                <div id="resultContainer" class="hidden">
                    <h3>Estimated Selling Price</h3>
                    <p id="predictedPrice"></p>
                </div>
                
                <div id="errorContainer" class="hidden">
                    <p id="errorMessage"></p>
                </div>
                
                <div id="loadingSpinner" class="hidden">
                    <div class="spinner"></div>
                    <p>Calculating...</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
